<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustration of a Beagle">
  <!-- soft background -->
  <rect width="200" height="200" fill="#fef3e2"/>

  <!-- floppy ears (brown) -->
  <ellipse cx="52" cy="92" rx="20" ry="42" fill="#7a4a23"/>
  <ellipse cx="148" cy="92" rx="20" ry="42" fill="#7a4a23"/>

  <!-- head (cream) -->
  <circle cx="100" cy="90" r="48" fill="#fdfaf4"/>

  <!-- brown eye patches (the Beagle's classic tri-color look) -->
  <ellipse cx="80" cy="82" rx="18" ry="16" fill="#9c6b3f"/>
  <ellipse cx="120" cy="82" rx="18" ry="16" fill="#9c6b3f"/>

  <!-- eyes -->
  <circle cx="80" cy="84" r="6" fill="#2b2b2b"/>
  <circle cx="120" cy="84" r="6" fill="#2b2b2b"/>

  <!-- muzzle -->
  <ellipse cx="100" cy="112" rx="26" ry="20" fill="#fdfaf4"/>

  <!-- nose -->
  <ellipse cx="100" cy="104" rx="9" ry="7" fill="#2b2b2b"/>

  <!-- smile -->
  <path d="M100 111 Q100 122 86 122" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M100 111 Q100 122 114 122" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
